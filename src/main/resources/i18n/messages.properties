# =============================================================================
# Access Management API — messages (en = module default, MUST be complete)
# =============================================================================
# Spring MessageSource bundle (spring.messages.basename=i18n/messages), UTF-8.
# Resolution per key: messages_<requested>.properties -> this file -> the key.
# Values are java.text.MessageFormat patterns (spring.messages.always-use-message-format=true):
# write a literal single quote as '' and never use named placeholders like {max}.
# Other languages (messages_pt.properties, messages_fr.properties) may be partial,
# but must not contain keys missing here and must keep the same {n} placeholders
# (enforced by MessageBundleConsistencyTest).

