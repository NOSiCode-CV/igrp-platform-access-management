# General
spring.config.import=optional:file:.env[.properties]

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.bytecode.provider=bytebuddy
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Spring Data REST
spring.data.rest.detection-strategy=annotated

# Swagger
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}
springdoc.swagger-ui.operationsSorter=method

# Actuator — OWASP A05. Only health (with the /actuator/health/liveness and
# /actuator/health/readiness probe groups) is published by default, and it is
# the only actuator path the security chain leaves public. Anything added to
# the include list below requires an authenticated request.
management.info.git.mode=full
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
# Never published, even if the include list above is widened to '*': these
# leak secrets (env, configprops, heapdump) or internals (threaddump, logfile).
management.endpoints.web.exposure.exclude=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_EXCLUDE:env,configprops,heapdump,threaddump,logfile,shutdown}
# Read-only cap: no writable loggers, no shutdown, no cache eviction.
management.endpoints.access.max-permitted=${MANAGEMENT_ENDPOINTS_ACCESS_MAX_PERMITTED:read-only}

# Health: anonymous callers only get the aggregate status (UP/DOWN).
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.show-components=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS:never}
management.endpoint.health.probes.enabled=true

# Spring Cloud
spring.cloud.kubernetes.discovery.enabled=true

# Disable Eureka client
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable Spring Cloud discovery autoconfiguration for Eureka
spring.cloud.discovery.enabled=false