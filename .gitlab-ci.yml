image: docker:28.2.2
services:
  - name: docker:28.2.2-dind
    command: [ "--tls=false", "--mtu=1240" ]
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  REGISTRY_URL: "registry.nosi.cv"
  IMAGE_NAME: "access-management-api"
  CI_PROJECT: "igrp"
  VERSION_TAG: "$CI_COMMIT_SHORT_SHA"
  PIPELINE_TAG: "$CI_PIPELINE_ID"
  IMAGE_NAME_FULL: "$REGISTRY_URL/$CI_PROJECT/$IMAGE_NAME"

stages:
  - build

# =============================================
#  Release pipelines (NOSi Registry - JVM amd64 only)
#
#  Branch  deploy/pre-release  -> tag  pre-release
#  Branch  deploy/0.1.0-beta   -> tag  0.1.0-beta
#  Branch  deploy/0.2.0-beta   -> tags 0.2.0-beta + latest
#
#  No pipeline runs on the mainline branch.
#  Native (GraalVM) and Azure builds are disabled for now.
# =============================================

build-jvm-amd64-pre-release:
  stage: build
  before_script:
    - apk add --no-cache curl bash
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"
  script:
    - docker buildx create --use --name releasebuilder || true
    - docker buildx inspect --bootstrap
    - docker build -f Dockerfile \
      --platform linux/amd64 \
      -t "$IMAGE_NAME_FULL-jvm:pre-release" \
      -t "$IMAGE_NAME_FULL-jvm:amd64-pre-release-$PIPELINE_TAG" \
      --no-cache --pull \
      --build-arg APP_BUILD_FINGERPRINT=$CI_COMMIT_SHA \
      --push .
  only:
    - deploy/pre-release

build-jvm-amd64-0.1.0-beta:
  stage: build
  before_script:
    - apk add --no-cache curl bash
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"
  script:
    - docker buildx create --use --name releasebuilder || true
    - docker buildx inspect --bootstrap
    - docker build -f Dockerfile \
      --platform linux/amd64 \
      -t "$IMAGE_NAME_FULL-jvm:0.1.0-beta" \
      -t "$IMAGE_NAME_FULL-jvm:amd64-0.1.0-beta-$PIPELINE_TAG" \
      --no-cache --pull \
      --build-arg APP_BUILD_FINGERPRINT=$CI_COMMIT_SHA \
      --push .
  only:
    - deploy/0.1.0-beta

build-jvm-amd64-0.2.0-beta:
  stage: build
  before_script:
    - apk add --no-cache curl bash
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"
  script:
    - docker buildx create --use --name releasebuilder || true
    - docker buildx inspect --bootstrap
    - docker build -f Dockerfile \
      --platform linux/amd64 \
      -t "$IMAGE_NAME_FULL-jvm:0.2.0-beta" \
      -t "$IMAGE_NAME_FULL-jvm:latest" \
      -t "$IMAGE_NAME_FULL-jvm:amd64-0.2.0-beta-$PIPELINE_TAG" \
      --no-cache --pull \
      --build-arg APP_BUILD_FINGERPRINT=$CI_COMMIT_SHA \
      --push .
  only:
    - deploy/0.2.0-beta
