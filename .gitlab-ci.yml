# =============================================
#  DevSecOps "code review" (gitlab-ci-templates da NOSI, stages à-la-carte)
#
#  test ──────────► sast
#  mvn verify       SonarQube (análise + Quality Gate)
#  + JaCoCo         importa o jacoco.xml do maven-test
#
#  Só análise de código SonarQube: sem secrets, SCA, imagem, deploy/DAST,
#  relatório nem archive. O `test` é obrigatório: o sonar-sast tem
#  `needs: maven-test` (cobertura no Sonar).
#  Resultados: UI do SonarQube + separadores Tests/cobertura do MR.
#
#  Pipelines:
#    MR  feature/* → development      → code review (projeto Sonar *-dev)
#    branch development               → code review após o merge
#    branch feature/devsecops-*       → validação deste CI
#    branch deploy/*                  → releases (inalteradas) + code review
#                                       no projeto Sonar da release
#
#  Variáveis CI/CD (grupo IGRP 3.0): SONAR_HOST_URL/TOKEN.
# =============================================

include:
  - project: 'devsecops/gitlab-ci-templates'
    ref: 'v4.0.0-rc.9'
    file:
      - '/templates/stages/test.yml'
      - '/templates/stages/sast.yml'

variables:
  REGISTRY_URL: "registry.nosi.cv"
  IMAGE_NAME: "access-management-api"
  CI_PROJECT: "igrp"
  VERSION_TAG: "$CI_COMMIT_SHORT_SHA"
  PIPELINE_TAG: "$CI_PIPELINE_ID"
  IMAGE_NAME_FULL: "$REGISTRY_URL/$CI_PROJECT/$IMAGE_NAME"

  # --- DevSecOps: projeto SonarQube ---
  # O SonarQube Community não separa branches: cada linha tem o seu projeto.
  # development (e MRs para ela) → *-dev; deploy/* → definido no workflow.
  SONAR_KEY: "igrp-access-management-dev"

  # --- DevSecOps: Maven (sem mexer no pom.xml) ---
  # - dependency-check do pom está ligado ao `verify` (descarregaria a NVD)
  #   → desligado: neste pipeline não há SCA.
  # - maven.test.failure.ignore + jacoco.haltOnFailure=false: testes a falhar
  #   ou cobertura < 76% não impedem o jacoco.xml → o Sonar recebe sempre a
  #   cobertura. As falhas continuam visíveis no separador Tests e no relatório.
  # - stdout dos testes → target/surefire-reports/*-output.txt (o log do job
  #   passava os 4 MB).
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    -Ddependency-check.skip=true
    -Dmaven.test.failure.ignore=true
    -Djacoco.haltOnFailure=false
    -Dmaven.test.redirectTestOutputToFile=true
    -Dsonar.projectKey=$SONAR_KEY

  # --- DevSecOps: gates em baseline (não bloqueiam) ---
  MAVEN_TEST_ALLOW_FAILURE: "true"

  # Runner do maven-test (tags: [$RUNNER_DEFAULT_TAG]). No template esta
  # variável só é definida no secrets.yml, que aqui não é incluído → sem esta
  # linha a tag fica literal "$RUNNER_DEFAULT_TAG" e o job fica preso na fila.
  # (O sonar-sast usa SAST_RUNNER_TAG, que o sast.yml já define.)
  RUNNER_DEFAULT_TAG: "nosi-runner"

# Cache .m2 partilhada pelos jobs Maven do DevSecOps
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

# O MR da própria branch devsecops não tem pipeline: a da branch já corre
# tudo (evita pipelines duplicadas).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^feature\/devsecops-/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "development"
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH =~ /^feature\/devsecops-/
    - if: $CI_COMMIT_BRANCH =~ /^deploy\//
      variables:
        SONAR_KEY: "igrp-access-management"

stages:
  - test
  - sast
  - build

# =============================================
#  Release pipelines (NOSi Registry - JVM amd64 only)
#
#  Branch  deploy/pre-release  -> tag  pre-release
#  Branch  deploy/0.1.0-beta   -> tag  0.1.0-beta
#  Branch  deploy/0.2.0-beta   -> tags 0.2.0-beta + latest
#
#  No pipeline runs on the mainline branch.
#  Native (GraalVM) and Azure builds are disabled for now.
#
#  `needs: []`: as releases não esperam pelos stages DevSecOps (correm em
#  paralelo, como até aqui).
# =============================================

.release-build:
  stage: build
  image: docker:28.2.2
  services:
    - name: docker:28.2.2-dind
      command: [ "--tls=false", "--mtu=1240" ]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  needs: []
  before_script:
    - apk add --no-cache curl bash
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"

build-jvm-amd64-pre-release:
  extends: .release-build
  script:
    - docker buildx create --use --name releasebuilder || true
    - docker buildx inspect --bootstrap
    - docker build -f Dockerfile --platform linux/amd64 -t "$IMAGE_NAME_FULL-jvm:pre-release" -t "$IMAGE_NAME_FULL-jvm:amd64-pre-release-$PIPELINE_TAG" --no-cache --pull --build-arg APP_BUILD_FINGERPRINT=$CI_COMMIT_SHA --push .
  only:
    - deploy/pre-release

build-jvm-amd64-0.1.0-beta:
  extends: .release-build
  script:
    - docker buildx create --use --name releasebuilder || true
    - docker buildx inspect --bootstrap
    - docker build -f Dockerfile --platform linux/amd64 -t "$IMAGE_NAME_FULL-jvm:0.1.0-beta" -t "$IMAGE_NAME_FULL-jvm:amd64-0.1.0-beta-$PIPELINE_TAG" --no-cache --pull --build-arg APP_BUILD_FINGERPRINT=$CI_COMMIT_SHA --push .
  only:
    - deploy/0.1.0-beta

build-jvm-amd64-0.2.0-beta:
  extends: .release-build
  script:
    - docker buildx create --use --name releasebuilder || true
    - docker buildx inspect --bootstrap
    - docker build -f Dockerfile --platform linux/amd64 -t "$IMAGE_NAME_FULL-jvm:0.2.0-beta" -t "$IMAGE_NAME_FULL-jvm:latest" -t "$IMAGE_NAME_FULL-jvm:amd64-0.2.0-beta-$PIPELINE_TAG" --no-cache --pull --build-arg APP_BUILD_FINGERPRINT=$CI_COMMIT_SHA --push .
  only:
    - deploy/0.2.0-beta
