# =============================================================
# Gitleaks — configuração para igrp-platform-access-management
#
# Base: extends default rules (cobre AWS/GCP/Azure/GitHub/Slack/etc.)
# Adicional: regras customizadas para padrões NOSI/IGRP.
#
# Documentação: https://github.com/gitleaks/gitleaks#configuration
# =============================================================

[extend]
# Estende as regras built-in do Gitleaks (recomendado).
useDefault = true

# -------------------------------------------------------------
# Regras customizadas
# -------------------------------------------------------------

[[rules]]
id = "harbor-robot-token"
description = "Harbor robot account token (padrão registry.nosi.cv / registry-az-core.nosi.cv)"
# Robot tokens Harbor começam por 'robot$' e têm > 20 chars alfanuméricos.
regex = '''robot\$[a-zA-Z0-9_\-+/=]{20,}'''
tags = ["secret", "harbor", "nosi"]

[[rules]]
id = "sonarqube-token"
description = "SonarQube user/project analysis token"
# Tokens SonarQube: prefixos sqa_/squ_/sqp_ seguidos de 40 hex chars.
regex = '''(?i)(sqa_|squ_|sqp_)[a-f0-9]{40}'''
tags = ["secret", "sonarqube"]

[[rules]]
id = "gitlab-pat"
description = "GitLab Personal Access Token"
regex = '''glpat-[A-Za-z0-9\-_]{20,}'''
tags = ["secret", "gitlab"]

[[rules]]
id = "postgres-jdbc-credentials"
description = "Credenciais Postgres JDBC com password em texto plano"
# Detecta jdbc:postgresql://user:password@...
regex = '''jdbc:postgresql://[a-zA-Z0-9_\-]+:[^@\s]+@'''
tags = ["secret", "database", "postgres"]

[[rules]]
id = "spring-datasource-password"
description = "Spring datasource password em application.yml/properties (literal, não ${VAR})"
# A char class [^\s'"#$] já exclui '$', portanto ${VAR_PLACEHOLDER} nunca dá match.
regex = '''(?i)spring\.datasource\.password\s*[:=]\s*['"]?[^\s'"#$]{4,}'''
tags = ["secret", "spring", "database"]

[[rules]]
id = "minio-credentials"
description = "MinIO access/secret key em config"
# Detecta access/secret keys MinIO típicas (40+ chars base64-like).
regex = '''(?i)(minio_access_key|minio_secret_key|aws_access_key_id|aws_secret_access_key)\s*[:=]\s*['"]?[A-Za-z0-9+/=]{16,}'''
tags = ["secret", "storage", "minio"]

[[rules]]
id = "private-key-block"
description = "Chave privada RSA/EC/DSA/OPENSSH em PEM"
regex = '''-----BEGIN ((RSA|EC|DSA|OPENSSH|PGP) )?PRIVATE KEY( BLOCK)?-----'''
tags = ["secret", "key", "critical"]

# -------------------------------------------------------------
# Allowlist (falsos positivos legítimos)
# -------------------------------------------------------------
[allowlist]
description = "Caminhos / padrões que NÃO devem disparar deteção"

# Não scanear:
# - Ficheiros de exemplo (.env.example, *-example.*)
# - Lock files de dependências
# - Pastas de tooling/framework IDE (IGRP, Cursor, Trae, etc.) — não vão
#   para a imagem final e contêm templates com passwords-exemplo.
# - Test resources marcadas como example
# - O próprio config do gitleaks
paths = [
    # Ficheiros de exemplo
    '''\.env\.example$''',
    '''application-example.*\.ya?ml$''',
    '''.*/test/resources/.*\.example\..*''',

    # Lock files e backups
    '''package-lock\.json$''',
    '''pom\.xml\.versionsBackup$''',

    # Config do próprio gitleaks
    '''\.gitleaks(\.toml|ignore)$''',

    # Pastas de tooling/framework (não fazem parte do artefacto final)
    '''^\.agents/''',
    '''^\.cursor/''',
    '''^\.igrpstudio/''',
    '''^\.specify/''',
    '''^\.trae/''',
    '''^\.claude/''',
    '''^\.vscode/''',
    '''^\.idea/''',

    # Pasta docs (geralmente contém exemplos)
    '''^docs/''',
    '''^specs/''',

    # Target / build outputs (nunca queremos scanear)
    '''^target/''',
]

# Regex que ignoram padrões em qualquer ficheiro
# (use com moderação; preferir o ficheiro .gitleaksignore para fingerprints).
regexes = [
    # Placeholders óbvios em docs/templates
    '''<.*PASSWORD.*>''',
    '''CHANGE.?ME''',
    '''<your.*>''',
    '''(?i)example\.com''',
]
