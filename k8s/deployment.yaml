apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-management
  labels:
    app: access-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: access-management
  template:
    metadata:
      labels:
        app: access-management
    spec:
      containers:
        - name: access-management
          image: registry.nosi.cv/igrp/access-management-api:latest
          ports:
            - containerPort: 8080
          # Spring Boot health probe groups — the only actuator paths left
          # public by the security chain (see application-production.properties).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://iam-cnpg-cluster-rw:5432/db_igrp_iam"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
          # Apache POI (SXSSFWorkbook) streams .xlsx exports through a temp file
          # under java.io.tmpdir, created as soon as the sheet is created. With a
          # read-only root filesystem and no writable /tmp, every .xlsx export
          # fails with a 500. This volume guarantees the writable scratch space.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
